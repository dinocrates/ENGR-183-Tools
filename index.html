<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ENGR-183 Tools</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: system-ui, 'Segoe UI', Roboto, sans-serif;
      }
      body {
        margin: 0;
        min-height: 100vh;
        background: #16171d;
        color: #d5d7dd;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      main {
        max-width: 640px;
        padding: 24px;
      }
      h1 {
        font-size: 28px;
        margin: 0 0 8px;
      }
      p {
        color: #9ca3af;
      }
      ul {
        list-style: none;
        padding: 0;
        margin: 24px 0 0;
        display: flex;
        flex-direction: column;
        gap: 8px;
      }
      a {
        display: block;
        padding: 12px 16px;
        border: 1px solid #2e303a;
        border-radius: 8px;
        color: #d5d7dd;
        text-decoration: none;
      }
      a:hover {
        border-color: #6b7280;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>ENGR-183 Tools</h1>
      <p>Browser tools for ENGR-183 (Programming with MATLAB for Engineers and Scientists).</p>
      <ul>
        <li><a href="octave-playground/">Octave Playground</a></li>
      </ul>
    </main>
  </body>
</html>
