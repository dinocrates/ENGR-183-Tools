name: Deploy ENGR-183 Tools to GitHub Pages

on:
  push:
    branches:
      - main
      - dev
    paths:
      - 'octave-playground/**'
      - 'engr183-harness/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # Both main and dev are checked out and built on every run, regardless
      # of which branch triggered it. GitHub Pages via deploy-pages publishes
      # one full-site snapshot per deploy -- if main and dev each deployed
      # independently, whichever ran last would silently wipe out the
      # other's published output. Building both into one artifact every time
      # means a dev push can never take down production and vice versa.
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          path: main-checkout

      - name: Checkout dev
        uses: actions/checkout@v4
        with:
          ref: dev
          path: dev-checkout

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: main-checkout/octave-playground/package-lock.json

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Setup micromamba
        uses: mamba-org/setup-micromamba@v1
        with:
          micromamba-version: '1.5.8-0'
          environment-name: placeholder
          create-args: python=3.12

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Sync harness (main)
        working-directory: main-checkout/octave-playground
        run: python3 scripts/sync_harness.py

      - name: Install main dependencies
        working-directory: main-checkout/octave-playground
        run: npm ci

      # Kernel assets (the Octave WASM build) are identical regardless of
      # which branch's *app code* is being tested -- built once from main's
      # pinned environment.yml (T1.3: don't float kernel versions) and reused
      # for dev too, so staging only varies the thing actually being staged
      # (app code) rather than accidentally testing a second moving part.
      # Must run after npm ci: build-kernel-assets.sh's own last step calls
      # vendor-worker-assets.mjs, which reads node_modules/@emscripten-forge/
      # mambajs-core -- confirmed by reproducing this exact failure locally
      # in WSL after the original single-checkout workflow's step order
      # (sync -> npm ci -> build kernel assets) got disturbed by this
      # rewrite.
      - name: Build kernel assets (shared, from main)
        working-directory: main-checkout/octave-playground
        shell: bash -l {0}
        run: bash scripts/build-kernel-assets.sh

      - name: Build main
        working-directory: main-checkout/octave-playground
        run: npm run build

      - name: Copy shared kernel assets into dev checkout
        run: |
          rm -rf dev-checkout/octave-playground/public/xeus
          cp -r main-checkout/octave-playground/public/xeus dev-checkout/octave-playground/public/xeus

      - name: Sync harness (dev)
        working-directory: dev-checkout/octave-playground
        run: python3 scripts/sync_harness.py

      - name: Build dev
        working-directory: dev-checkout/octave-playground
        run: |
          npm ci
          npm run build

      - name: Assemble Pages artifact
        run: |
          mkdir -p _site/octave-playground
          mkdir -p _site/octave-playground-dev
          cp main-checkout/index.html _site/index.html
          cp -R main-checkout/octave-playground/dist/. _site/octave-playground/
          cp -R dev-checkout/octave-playground/dist/. _site/octave-playground-dev/
          touch _site/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
