<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ENGR-183 Octave Playground</title>
    <script src="./coi-serviceworker.js"></script>
    <!--
      GitHub Pages can't set custom response headers, so without this the
      page never gets crossOriginIsolated -- which forces the kernel onto
      its comlink.worker.js transport (vs. coincident.worker.js) instead of
      the SharedArrayBuffer one, and that fallback turned out to be broken
      for filesystem/cwd operations (confirmed live: "unable to find current
      directory" on every Run Tests/Run File, even though the kernel itself
      booted fine). This is the standard COI shim
      (github.com/gzuidhof/coi-serviceworker): it registers a service worker
      that injects COOP/COEP on the page's own responses and reloads once to
      pick them up, achieving isolation on static hosting with no server
      config. Vendored verbatim, not modified.
    -->
    <script>
      // The vendored script above only ever attempts ONE reload per
      // session (guarded by its own sessionStorage flag) to pick up the
      // service worker. Confirmed live: on some timing that one reload
      // doesn't land on a load the service worker actually controls, and
      // crossOriginIsolated stays false for the rest of the session with
      // no further attempt -- see m0-spike-driver/t21-diag*.js. A second
      // real top-level navigation reliably does pick it up, so force one
      // more here, once, if we're still not isolated after giving the
      // vendored script's own logic a moment to do its thing first.
      (function () {
        var key = 'engr183ExtraCoiReloadDone';
        if (window.crossOriginIsolated || sessionStorage.getItem(key)) {
          return;
        }
        setTimeout(function () {
          if (!window.crossOriginIsolated) {
            sessionStorage.setItem(key, '1');
            window.location.reload();
          }
        }, 1500);
      })();
    </script>
    <script>
      // Must run before any module script (below) is evaluated: @jupyterlab's
      // PageConfig memoizes its config on first read, and something in the
      // jupyterlite/jupyterlab import graph reads it at module-init time --
      // before our own code ever runs -- which locks in an empty baseUrl for
      // the page's whole lifetime. That broke kernel asset URLs once actually
      // deployed under a subpath (confirmed live: they resolved to the
      // domain root instead of .../octave-playground/xeus/...). See
      // src/kernel/session.ts's ensurePageConfig, which is now just a no-op
      // fallback since this script wins the race.
      (function () {
        var el = document.createElement('script');
        el.id = 'jupyter-config-data';
        el.type = 'application/json';
        el.textContent = JSON.stringify({ baseUrl: new URL('.', window.location.href).href });
        document.head.appendChild(el);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
